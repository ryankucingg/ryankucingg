<title>Streak</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c5de7"/><stop offset="1" stop-color="#a35de4"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="711" height="171" rx="14" fill="#fcfcff" stroke="#e6e6ef"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
