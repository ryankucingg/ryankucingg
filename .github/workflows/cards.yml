name: Update cards

on:
  schedule:
    - cron: '23 17 * * *' # 00:23 WIB, after the day's commits
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/cards.mjs
      - .github/workflows/cards.yml

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Draw the cards
        run: node scripts/cards.mjs
        env:
          # A fine-grained token with "Metadata: read" on your repos lets the numbers include private work
          # (commits in private repositories count as contributions). Without it the workflow's own token is used.
          GH_TOKEN: ${{ secrets.CARDS_TOKEN || github.token }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cards
          git diff --cached --quiet && exit 0
          git commit -m 'cards: today’s paw prints [skip ci]'
          git push
